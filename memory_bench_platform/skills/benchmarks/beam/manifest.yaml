kind: benchmark
id: beam
version: 0.1.0
version_policy:
  targets:
    - name: beam-release-data
      scope: benchmark_tooling
      version_source: runtime_observed_only
      upstream: https://github.com/mohammadtavakoli78/BEAM
      required: false
      notes: Record the revision of the released dataset supplied for the run.
entry:
  scenario_builder: scripts/build_scenario.py
  scorer: scripts/report_scores.py
dataset:
  default_split: 100K
  requires_data_path: true
execution:
  mode: multi_turn
  requires_stateful_agent: true
  task_isolation: per_task
  ingest_unit: session
judging:
  mode: external
  type: llm
  profile: beam_official@1
  handler: evaluation/official.py
  handler_protocol: judge-handler/1
  extractor: qa_answer
  prompt_template: evaluation/judge.txt
  api_format: openai
  timeout_seconds: 900
  max_tokens: 1024
  env:
    api_key: BEAM_API_KEY
    base_url: BEAM_BASE_URL
    model: BEAM_METRIC_MODEL
integration:
  protocol_version: benchmark/1
requirements:
  agent:
    multi_turn: true
    stateful_session: true
  memory:
    actions: [ingest, recall]
evaluation:
  target: qa_answer
  profile: llm_judge@1
  primary_metric: mean_category_score
  minimum_coverage: 1.0
  minimum_checkpoint_ready_rate: 1.0
  maximum_runtime_failure_rate: 0.0

kind: benchmark
id: longmemeval
version: 0.1.0
version_policy:
  default_selection: latest_official_release_tag
  resolution_order:
    - user_specified_official_version
    - latest_official_release_tag
    - verified_fallback_release_tag
    - historical_repro_release_tag
  allowed_overrides:
    - user_specified_official_version
    - verified_fallback_release_tag
    - historical_repro_release_tag
  disallowed_defaults:
    - dirty_worktree
    - dev_build
    - non_tag_commit
  targets:
    - name: longmemeval-benchmark
      scope: benchmark_tooling
      version_source: upstream_release_tag
      upstream: https://github.com/xiaowu0162/LongMemEval
      record_runtime_version: true
  record_runtime_version: true
  notes: Resolve the latest official LongMemEval tag by default, and require the paired agent stack to follow its own latest-tag policy unless the run explicitly overrides it.
entry:
  scenario_builder: scripts/build_scenario.py
  case_builder: scripts/build_tasks.py
  validator: scripts/validate.py
  scorer: scripts/score_predictions.py
dataset:
  default_split: dev
execution:
  mode: multi_turn
  requires_stateful_agent: true
  task_isolation: per_task
judging:
  mode: external
  type: llm
  profile: longmemeval_qa@1
  extractor: qa_answer
  prompt_template: evaluation/llm_judge_prompt.txt
  api_format: openai
  timeout_seconds: 60
  env:
    api_key: LONGMEMEVAL_API_KEY
    base_url: LONGMEMEVAL_BASE_URL
    model: LONGMEMEVAL_METRIC_MODEL
integration:
  protocol_version: benchmark/1
requirements:
  agent:
    multi_turn: true
    stateful_session: true
  memory:
    actions: [ingest, recall]
evaluation:
  target: qa_answer
  profile: llm_judge@1
  primary_metric: accuracy
  minimum_coverage: 1.0
  minimum_checkpoint_ready_rate: 1.0
  maximum_runtime_failure_rate: 0.0

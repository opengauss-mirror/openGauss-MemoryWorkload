kind: benchmark
id: locomo
version: 0.1.0
version_policy:
  default_selection: latest_official_release_tag
  resolution_order:
    - user_specified_official_version
    - latest_official_release_tag
    - verified_fallback_release_tag
    - historical_repro_release_tag
  allowed_overrides:
    - user_specified_official_version
    - verified_fallback_release_tag
    - historical_repro_release_tag
  disallowed_defaults:
    - dirty_worktree
    - dev_build
    - non_tag_commit
  targets:
    - name: locomo-benchmark
      scope: benchmark_tooling
      version_source: upstream_release_tag
      upstream: https://github.com/snap-research/locomo
      record_runtime_version: true
  record_runtime_version: true
  notes: Resolve the latest official LoCoMo benchmark tag by default, and require the paired agent stack to follow its own latest-tag policy unless the run explicitly overrides it.
entry:
  case_builder: scripts/build_tasks.py
  validator: scripts/validate.py
  scorer: scripts/score_predictions.py
dataset:
  default_split: small
  local_source: ../../../../locomo_test/data/locomo_small.json
execution:
  mode: multi_turn
  requires_stateful_agent: true
  task_isolation: per_task
  ingest_unit: session
  entrypoints:
    official_small:
      external_runner: ../../../../tools/test_entrypoints/run_official_locomo_small.sh
    official_sample0:
      external_runner: ../../../../tools/test_entrypoints/run_official_locomo_sample.sh
    locomo_test_remote:
      external_runner: ../../../../tools/test_entrypoints/run_locomo_test_remote.sh
    openclaw_import:
      external_runner: ../../../../tools/test_entrypoints/run_locomo_openclaw_import.sh
judging:
  mode: external
  type: llm
  prompt_style: locomo
  api_format: openai
  timeout_seconds: 60
  env:
    api_key: LOCOMO_API_KEY
    base_url: LOCOMO_BASE_URL
    model: LOCOMO_METRIC_MODEL

kind: benchmark
id: locomo
version: 0.1.0
version_policy:
  default_selection: latest_official_release_tag
  resolution_order:
    - user_specified_official_version
    - latest_official_release_tag
    - verified_fallback_release_tag
    - historical_repro_release_tag
  allowed_overrides:
    - user_specified_official_version
    - verified_fallback_release_tag
    - historical_repro_release_tag
  disallowed_defaults:
    - dirty_worktree
    - dev_build
    - non_tag_commit
  targets:
    - name: locomo-benchmark
      scope: benchmark_tooling
      record_runtime_version: true
  record_runtime_version: true
  notes: External LoCoMo runners should prefer latest official release tags for the tested agent stack.
entry:
  case_builder: scripts/build_tasks.py
  validator: scripts/validate.py
  scorer: scripts/score_predictions.py
dataset:
  default_split: small
  local_source: ../../../../locomo_test/data/locomo_small.json
execution:
  mode: multi_turn
  requires_stateful_agent: true
  task_isolation: per_task
  entrypoints:
    official_small:
      external_runner: ../../../../tools/test_entrypoints/run_official_locomo_small.sh
    official_sample0:
      external_runner: ../../../../tools/test_entrypoints/run_official_locomo_sample.sh
judging:
  mode: external

kind: agent
id: openclaw
version: 0.1.0
version_policy:
  default_selection: latest_official_release_tag
  resolution_order:
    - user_specified_official_version
    - latest_official_release_tag
    - verified_fallback_release_tag
    - historical_repro_release_tag
  allowed_overrides:
    - user_specified_official_version
    - verified_fallback_release_tag
    - historical_repro_release_tag
  disallowed_defaults:
    - dirty_worktree
    - dev_build
    - non_tag_commit
  targets:
    - name: openclaw
      scope: system_under_test
      upstream: https://github.com/coding-guy/openclaw
      record_runtime_version: true
    - name: openviking
      scope: memory_backend
      upstream: https://github.com/xforce-io/openviking
      record_runtime_version: true
  record_runtime_version: true
  notes: Default to latest official release tags for both OpenClaw and OpenViking, and record the resolved runtime versions in every real run.
entry:
  runner: scripts/run_task.py
  healthcheck: scripts/healthcheck.py
runtime:
  mode: service
io:
  protocol_mode: stateful_session
lifecycle:
  startup_required: true
collection:
  stdout: true
  stderr: true

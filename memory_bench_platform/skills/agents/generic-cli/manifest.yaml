kind: agent
id: generic-cli
version: 0.1.0
version_policy:
  default_selection: latest_official_release_tag
  resolution_order:
    - user_specified_official_version
    - latest_official_release_tag
    - verified_fallback_release_tag
    - historical_repro_release_tag
  allowed_overrides:
    - user_specified_official_version
    - verified_fallback_release_tag
    - historical_repro_release_tag
  disallowed_defaults:
    - dirty_worktree
    - dev_build
    - non_tag_commit
  targets:
    - name: generic-cli
      scope: system_under_test
      record_runtime_version: true
  record_runtime_version: true
  notes: If the wrapped CLI has no official release tag concept, the run must record the concrete binary, package version, or commit source explicitly.
entry:
  runner: scripts/run_task.py
  healthcheck: scripts/healthcheck.py
runtime:
  mode: process
io:
  protocol_mode: stateless_cli
lifecycle:
  startup_required: false
collection:
  stdout: true
  stderr: true

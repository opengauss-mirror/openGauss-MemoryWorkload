kind: agent
id: hermes
version: 0.1.0
version_policy:
  default_selection: latest_official_release_tag
  allowed_overrides:
    - user_specified_official_version
    - verified_fallback_release_tag
    - historical_repro_release_tag
  disallowed_defaults:
    - dirty_worktree
    - dev_build
    - non_tag_commit
  record_runtime_version: true
  notes: Hermes runs should prefer the latest official CLI release tag when one exists.
entry:
  runner: scripts/run_task.py
  healthcheck: scripts/healthcheck.py
runtime:
  mode: process
io:
  protocol_mode: stateless_cli
lifecycle:
  startup_required: false
collection:
  stdout: true
  stderr: true

schema: deployment/1
env_file: .env
local_images_only: true
name: jiuwenmemory-openclaw-locomo
agents:
  claw:
    skill: openclaw
    image:
      name: ${OPENCLAW_IMAGE}
    command:
    - openclaw
    - gateway
    - run
    container_port: 18789
    healthcheck:
    - CMD
    - node
    - -e
    - fetch('http://127.0.0.1:18789/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
    verify:
      command:
      - node
      - -e
      - (async()=>{if(!(await
        fetch(process.env.MEMORY_URL+'/health')).ok)throw Error('memory not ready');console.log(JSON.stringify({version:require('/app/package.json').version,endpoints:{MEMORY_URL:process.env.MEMORY_URL},reachable:{memory:true},effective_parameters:{}}))})().catch(e=>{console.error(e.message);process.exit(1)})
      expected_version: 2026.6.9
    client:
      endpoint_env: OPENCLAW_GATEWAY_URL
    service_endpoints:
      MEMORY_URL: memory
memories:
  jiuwenmemory:
    skill: jiuwenmemory
    client:
      endpoint_env: MEMORY_API_URL
    image:
      name: ${MEMORY_IMAGE}
    container_port: ${MEMORY_PORT:int}
    healthcheck:
    - CMD
    - python3
    - -c
    - import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['BENCH_PORT']+os.environ['BENCH_HEALTH_PATH'],timeout=5)
    environment:
      BENCH_PORT: ${MEMORY_PORT}
      BENCH_HEALTH_PATH: /health
    verify:
      command:
      - python3
      - -c
      - import json;print(json.dumps({'version':'http-health/1','endpoints':{},'reachable':{},'effective_parameters':{}}))
      expected_version: http-health/1
    config_mounts:
    - source: ${MEMORY_CONFIG_PATH}
      target: ${MEMORY_CONFIG_TARGET}
    state_mounts:
    - target: ${MEMORY_DATA_TARGET}
combinations:
- id: jiuwenmemory-openclaw
  benchmark: locomo
  agent: claw
  memory: jiuwenmemory
  memory_integration: agent_plugin
  data_path: ${DATA_PATH}
  plugin_runtime:
    source_config: configs/openclaw.json
    expand_env: true
experiment:
  fresh: true
  cleanup_owned_deployment: true

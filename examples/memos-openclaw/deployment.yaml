schema: deployment/1
env_file: .env
local_images_only: true
name: memos-openclaw-locomo
agents:
  claw:
    skill: openclaw
    image:
      name: ${OPENCLAW_IMAGE}
    command:
    - openclaw
    - gateway
    - run
    container_port: 18789
    healthcheck_interval_seconds: 5
    environment:
      MEMOS_BEFORE_PROMPT_SOFT_TIMEOUT_MS: "${MEMOS_BEFORE_PROMPT_SOFT_TIMEOUT_MS:-30000}"
    healthcheck:
    - CMD
    - node
    - -e
    - fetch('http://127.0.0.1:18789/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
    verify:
      command:
      - node
      - -e
      - (async()=>{console.log(JSON.stringify({version:require('/app/package.json').version,endpoints:{},reachable:{},effective_parameters:{}}))})().catch(e=>{console.error(e.message);process.exit(1)})
      expected_version: 2026.6.9
    client:
      endpoint_env: OPENCLAW_GATEWAY_URL
memories:
  memos:
    skill: memos
    client:
      endpoint_env: MEMORY_API_URL
    placement: agent
    container_port: 18799
combinations:
- id: memos-openclaw
  benchmark: locomo
  agent: claw
  memory: memos
  memory_integration: agent_plugin
  data_path: ${DATA_PATH}
  # 默认串行。启用跨样本 QA 并发时，同时取消 execution、sample_concurrency 和 qa_concurrency 的注释。
  # execution:
  #   sample_concurrency: 2
  #   qa_concurrency: 2
  #   judge_concurrency: 4
  plugin_runtime:
    source_config: configs/openclaw.json
    expand_env: true
    upstream_plugin: ${PLUGIN_PATH}
    memory_config: configs/memory.yaml
experiment:
  fresh: true
  cleanup_owned_deployment: true

schema: deployment/1
env_file: .env
local_images_only: true
name: mem0-openclaw-locomo
agents:
  claw:
    skill: openclaw
    image:
      name: ${OPENCLAW_IMAGE}
    command:
    - openclaw
    - gateway
    - run
    container_port: 18789
    environment:
      NODE_PATH: /official
    healthcheck:
    - CMD
    - node
    - -e
    - fetch('http://127.0.0.1:18789/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
    verify:
      command:
      - node
      - -e
      - (async()=>{await
        new Promise((ok,no)=>{const s=require('node:net').connect(5432,'vector',()=>{s.end();ok()});s.on('error',no);s.setTimeout(5000,()=>s.destroy(Error('timeout')))});console.log(JSON.stringify({version:require('/app/package.json').version,endpoints:{VECTOR_URL:process.env.VECTOR_URL},reachable:{vector:true},effective_parameters:{}}))})().catch(e=>{console.error(e.message);process.exit(1)})
      expected_version: 2026.6.9
    client:
      endpoint_env: OPENCLAW_GATEWAY_URL
    service_endpoints:
      VECTOR_URL: vector
    allow_agent_storage_access: true
memories:
  mem0:
    skill: mem0
    client:
      endpoint_env: MEMORY_API_URL
    placement: agent
combinations:
- id: mem0-openclaw
  benchmark: locomo
  agent: claw
  memory: mem0
  memory_integration: agent_plugin
  data_path: ${DATA_PATH}
  plugin_runtime:
    source_config: configs/openclaw.json
    expand_env: true
    upstream_plugin: ${PLUGIN_PATH}
  vector: database
vectors:
  database:
    image:
      name: ${PGVECTOR_IMAGE}
    container_port: 5432
    state_mounts:
    - target: /var/lib/postgresql/data
    environment_from:
      POSTGRES_PASSWORD: DB_PASSWORD
    healthcheck:
    - CMD
    - pg_isready
    - -U
    - postgres
experiment:
  fresh: true
  cleanup_owned_deployment: true
